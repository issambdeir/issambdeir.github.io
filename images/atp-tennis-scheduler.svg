<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b7bff" />
      <stop offset="100%" stop-color="#5ee6c8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="240" fill="#14151c" />
  <circle cx="200" cy="120" r="140" fill="url(#glow)" />

  <!-- Court outline -->
  <rect x="60" y="40" width="280" height="160" rx="4" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.9" />
  <!-- Singles sidelines -->
  <line x1="90" y1="40" x2="90" y2="200" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5" />
  <line x1="310" y1="40" x2="310" y2="200" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5" />
  <!-- Service lines -->
  <line x1="130" y1="40" x2="130" y2="200" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5" />
  <line x1="270" y1="40" x2="270" y2="200" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5" />
  <line x1="130" y1="120" x2="270" y2="120" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5" />
  <!-- Net -->
  <line x1="200" y1="40" x2="200" y2="200" stroke="#f1f2f5" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Ball -->
  <circle cx="245" cy="95" r="10" fill="url(#accentGrad)" />
  <path d="M 237 90 Q 245 98 237 100" stroke="#0b0c10" stroke-width="1" fill="none" opacity="0.5" />
  <path d="M 253 90 Q 245 98 253 100" stroke="#0b0c10" stroke-width="1" fill="none" opacity="0.5" />

  <text x="200" y="225" text-anchor="middle" font-family="Sora, sans-serif" font-size="13" fill="#9a9ea8" letter-spacing="1">
    ATP TENNIS SCHEDULER
  </text>
</svg>
